      - generic [ref=f35e495]:
        - generic [ref=f35e496]:
          - paragraph [ref=f35e497]: Oculoplasty
          - heading "Specialist Oculoplasty for Function & Appearance" [level=2] [ref=f35e498]
          - paragraph [ref=f35e499]: Oculoplasty is a branch of ophthalmology focused on the eyelids, tear passages, eye socket and surrounding eye area. Some concerns affect vision or eye comfort. Others affect appearance. Many involve both.
          - generic [ref=f35e500]:
            - article [ref=f35e501]:
              - generic [ref=f35e502]:
                - heading "Functional Concerns" [level=3] [ref=f35e513]
                - list [ref=f35e515]:
                  - listitem [ref=f35e516]: Drooping eyelids (ptosis) that make the eye look tired or affect vision
                  - listitem [ref=f35e517]: Persistent watering or tear-drainage problems
                  - listitem [ref=f35e518]: Eyelids turning inward or outward
                  - listitem [ref=f35e519]: Other eyelid-position concerns
            - article [ref=f35e520]:
              - generic [ref=f35e521]:
                - heading "Aesthetic Concerns" [level=3] [ref=f35e531]
                - list [ref=f35e533]:
                  - listitem [ref=f35e534]: Heavy upper eyelids
                  - listitem [ref=f35e535]: Loose eyelid skin
                  - listitem [ref=f35e536]: Under-eye bags
                  - listitem [ref=f35e537]: Age-related changes around the eyes
          - generic [ref=f35e538]:
            - link "Reconstructive Oculoplasty" [ref=f35e539] [cursor=pointer]:
              - /url: /eye-plastic-reconstructive-surgery
            - link "Aesthetic Oculoplasty" [ref=f35e542] [cursor=pointer]:
              - /url: /aesthetic-oculofacial
