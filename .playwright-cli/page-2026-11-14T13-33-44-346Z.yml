            - paragraph [ref=e296]: The whole scene is in view, including its edges.
            - paragraph [ref=e297]: Vision lost to glaucoma does not come back, and early on most people notice nothing. Regular examination is how it is found, and how any change is caught.
    - region "Who should have regular eye checks" [ref=e298]:
      - generic [ref=e299]:
        - generic [ref=e300]:
          - paragraph [ref=e301]: Know the signs
          - heading "Who should have regular eye checks" [level=2] [ref=e302]
        - generic [ref=e303]:
          - generic [ref=e304]: Anyone with a close relative who has glaucoma
          - generic [ref=e309]: People over 40, because the risk rises with age
          - generic [ref=e314]: People who are very short-sighted
          - generic [ref=e319]: People with diabetes or high blood pressure
          - generic [ref=e324]: People who have been told their eye pressure is high
          - generic [ref=e329]: People who use steroid medicines over a long period, as advised by their doctor
          - generic [ref=e334]: People who have had an injury to the eye
          - generic [ref=e340]:
            - strong [ref=e341]: "Urgent Medical Attention:"
            - text: Sudden eye pain with redness, halos around lights, headache or sickness needs urgent medical attention.
