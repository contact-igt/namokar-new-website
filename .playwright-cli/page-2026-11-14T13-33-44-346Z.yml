        - generic [ref=e38]:
          - generic [ref=e39]:
            - paragraph [ref=e40]: Glaucoma Management
            - heading "Glaucoma care starts with regular check-ups." [level=1] [ref=e41]
            - paragraph [ref=e42]: Glaucoma often has no early symptoms. Examination and long-term follow-up are how it is found and kept under watch.
            - link "Call to Book an Appointment" [ref=e44] [cursor=pointer]:
              - /url: tel:+919810419720
            - generic [ref=e47]:
              - generic [ref=e53]:
                - generic [ref=e54]: Advanced
                - generic [ref=e55]: Technology
              - generic [ref=e62]:
                - generic [ref=e63]: Expert
                - generic [ref=e64]: Doctors
              - generic [ref=e70]:
                - generic [ref=e71]: Compassionate
                - generic [ref=e72]: Care
          - img "Eye examination at Namokar Eye & Oculoplasty Centre" [ref=e74]
    - region "What is glaucoma?" [ref=e75]:
      - generic [ref=e78]:
        - paragraph [ref=e79]: COMPREHENSIVE VISION CARE
        - heading "What is glaucoma?" [level=2] [ref=e80]
        - generic [ref=e81]:
          - paragraph [ref=e82]: Glaucoma is a group of eye conditions in which the optic nerve, which carries what the eye sees to the brain, is gradually damaged. Raised pressure inside the eye is a common factor, but it is not the only one.
          - paragraph [ref=e83]: Glaucoma is often called the silent thief of sight because it can take side vision slowly and without pain. Left untreated, it can lead to permanent loss of vision.
          - paragraph [ref=e84]: Glaucoma is usually a long-term condition that is managed rather than cured. Damage to the optic nerve cannot be reversed, so the aim of care is to find glaucoma early and to protect the vision that remains. Treatment and follow-up are planned for each person.
    - region "Often no early symptoms. That is why an examination matters." [ref=e85]:
      - generic [ref=e88]:
        - paragraph [ref=e89]: Why check-ups matter
        - heading "Often no early symptoms. That is why an examination matters." [level=2] [ref=e90]
        - paragraph [ref=e91]: Vision lost to glaucoma does not come back, and early on most people notice nothing. Regular examination is how it is found, and how any change is caught.
    - region "Changes you may notice" [ref=e92]:
      - generic [ref=e93]:
        - generic [ref=e94]:
          - paragraph [ref=e95]: Signs to notice
          - heading "Changes you may notice" [level=2] [ref=e96]
          - paragraph [ref=e97]: Early glaucoma often shows nothing at all. When changes do appear, they tend to be slow, so they are easy to put down to age or tired eyes.
        - list [ref=e101]:
          - listitem [ref=e102]:
            - generic [ref=e107]:
              - heading "Changing glasses often" [level=3] [ref=e108]
              - paragraph [ref=e109]: Needing a new prescription again and again can be a sign worth mentioning to the doctor.
          - listitem [ref=e110]:
            - generic [ref=e115]:
              - heading "Narrowing side vision" [level=3] [ref=e116]
              - paragraph [ref=e117]: Side (peripheral) vision can shrink slowly, sometimes described as tunnel vision.
          - listitem [ref=e118]:
            - generic [ref=e123]:
              - heading "Missing things at the edge" [level=3] [ref=e124]
              - paragraph [ref=e125]: Bumping into objects or people, or tripping, because part of the view is missing.
          - listitem [ref=e126]:
            - generic [ref=e131]:
              - heading "Needing brighter light" [level=3] [ref=e132]
              - paragraph [ref=e133]: Finding that you need much more light than before to see well.
          - listitem [ref=e134]:
            - generic [ref=e139]:
              - heading "Blurred or hazy vision" [level=3] [ref=e140]
              - paragraph [ref=e141]: Vision that looks misty or less clear, without an obvious reason.
          - listitem [ref=e142]:
            - generic [ref=e147]:
              - heading "A vague ache around the eye" [level=3] [ref=e148]
              - paragraph [ref=e149]: A dull ache or feeling of pressure in or around the eye.
        - paragraph [ref=e151]:
          - strong [ref=e152]: "Please note:"
          - text: None of these proves glaucoma, and glaucoma can be present without any of them. Only an eye examination can tell.
    - region "Common types of glaucoma" [ref=e153]:
      - generic [ref=e154]:
        - generic [ref=e155]:
          - paragraph [ref=e156]: Types
          - heading "Common types of glaucoma" [level=2] [ref=e157]
          - paragraph [ref=e158]: Knowing which type a person has helps the doctor choose the right care.
        - generic [ref=e159]:
          - generic [ref=e161]:
            - img "3D cutaway of eye showing increased fluid pressure on optic nerve" [ref=e162]
            - generic [ref=e163]:
              - strong [ref=e164]: Fluid Pressure & The Optic Nerve
              - text: Increased intraocular pressure gradually compresses nerve fibres at the optic disc.
          - generic [ref=e166]:
            - generic [ref=e167]:
              - generic [ref=e168]: "01"
              - generic [ref=e169]:
                - heading "Open-angle glaucoma" [level=3] [ref=e170]
                - paragraph [ref=e171]: The most common type. The drainage channels of the eye stay open but drain too slowly, and damage builds up gradually. There is usually no pain and no early symptom.
            - generic [ref=e172]:
              - generic [ref=e173]: "02"
              - generic [ref=e174]:
                - heading "Normal-tension glaucoma" [level=3] [ref=e175]
                - paragraph [ref=e176]: The optic nerve is damaged even though the eye pressure measures within the normal range. It is one reason a full examination is needed and not a pressure reading alone.
            - generic [ref=e177]:
              - generic [ref=e178]: "03"
              - generic [ref=e179]:
                - heading "Angle-closure glaucoma" [level=3] [ref=e180]
                - paragraph [ref=e181]: The drainage angle of the eye becomes narrow or blocked. It can build up slowly or, in an acute attack, within hours.
        - generic [ref=e182]:
          - generic [ref=e183]: ⚠️
          - generic [ref=e184]:
            - strong [ref=e185]: "Emergency Note:"
            - text: A sudden attack of angle-closure glaucoma is an emergency. Severe eye pain with redness, blurred vision, halos around lights, headache or sickness needs urgent medical attention.
    - region "How glaucoma is found and followed" [ref=e186]:
      - generic [ref=e187]:
        - generic [ref=e188]:
          - generic [ref=e189]:
            - paragraph [ref=e190]: Diagnosis and monitoring
            - heading "How glaucoma is found and followed" [level=2] [ref=e191]
            - paragraph [ref=e192]: Checking eye pressure alone is not enough. The doctor looks at the nerve, the drainage angle and the field of vision together. These are tests a doctor may use; which ones you need, and how often, is the doctor’s decision.
          - figure [ref=e193]:
            - img "Eye testing instrument at Namokar Eye & Oculoplasty Centre" [ref=e194]
        - list [ref=e195]:
          - listitem [ref=e196]:
            - generic [ref=e197]: "01"
            - heading "Eye pressure (tonometry)" [level=3] [ref=e198]
            - paragraph [ref=e199]: Measures the pressure inside the eye, because raised pressure is a common factor in glaucoma.
          - listitem [ref=e200]:
            - generic [ref=e201]: "02"
            - heading "Optic nerve examination" [level=3] [ref=e202]
            - paragraph [ref=e203]: The nerve at the back of the eye is examined for thinning or other changes that glaucoma causes.
          - listitem [ref=e204]:
            - generic [ref=e205]: "03"
            - heading "Visual field test" [level=3] [ref=e206]
            - paragraph [ref=e207]: Maps your side vision and shows whether any part of it has been lost, often without the person noticing.
          - listitem [ref=e208]:
            - generic [ref=e209]: "04"
            - heading "OCT scan" [level=3] [ref=e210]
            - paragraph [ref=e211]: A scan that can show the thickness of the nerve fibre layer, which helps to pick up change over time.
          - listitem [ref=e212]:
            - generic [ref=e213]: "05"
            - heading "Drainage angle (gonioscopy)" [level=3] [ref=e214]
            - paragraph [ref=e215]: Looks at the drainage angle of the eye, which helps to tell the types of glaucoma apart.
          - listitem [ref=e216]:
            - generic [ref=e217]: "06"
            - heading "Corneal thickness" [level=3] [ref=e218]
            - paragraph [ref=e219]: The thickness of the front of the eye can affect how an eye pressure reading is interpreted.
    - region "How fluid drains, and how pressure can rise" [ref=e220]:
      - generic [ref=e221]:
        - generic [ref=e222]:
          - paragraph [ref=e223]: See it explained
          - heading "How fluid drains, and how pressure can rise" [level=2] [ref=e224]
          - paragraph [ref=e225]: Compare normal drainage with slowed drainage to see one common way pressure can rise inside the eye.
        - figure [ref=e226]:
          - generic [ref=e227]:
            - figure "Fluid drains as it is made Clear fluid flows through the pupil and drains at the angle where the iris meets the cornea, helping pressure stay within a healthy range." [ref=e228]:
              - heading "Drains normally" [level=3] [ref=e229]
              - img "Eye cross-section showing aqueous fluid flowing normally through the pupil and drainage angle" [ref=e231]
              - generic [ref=e232]:
                - strong [ref=e233]: Fluid drains as it is made
                - generic [ref=e234]: Clear fluid flows through the pupil and drains at the angle where the iris meets the cornea, helping pressure stay within a healthy range.
            - figure "Pressure can rise When fluid drains too slowly, it can build up inside the eye and raise pressure, which may damage the optic nerve over time." [ref=e235]:
              - heading "Drainage slowed" [level=3] [ref=e236]
              - img "Eye cross-section showing slowed aqueous-fluid drainage and pressure building inside the eye" [ref=e238]
              - generic [ref=e239]:
                - strong [ref=e240]: Pressure can rise
                - generic [ref=e241]: When fluid drains too slowly, it can build up inside the eye and raise pressure, which may damage the optic nerve over time.
    - region "How glaucoma is treated" [ref=e242]:
      - generic [ref=e243]:
        - generic [ref=e244]:
          - paragraph [ref=e245]: Treatment
          - heading "How glaucoma is treated" [level=2] [ref=e246]
          - paragraph [ref=e247]: Treatment aims to lower the pressure in the eye and protect the vision that is left. It cannot bring back vision that has already been lost.
        - list [ref=e248]:
          - listitem [ref=e249]:
            - img "Eye drops" [ref=e251]
            - generic [ref=e252]:
              - heading "Eye drops" [level=3] [ref=e256]
              - paragraph [ref=e257]: Often the first step. Drops lower the pressure in the eye, and they only work when they are used regularly as prescribed.
          - listitem [ref=e258]:
            - img "Laser treatment" [ref=e260]
            - generic [ref=e261]:
              - heading "Laser treatment" [level=3] [ref=e266]
              - paragraph [ref=e267]: In suitable eyes, a laser can help fluid drain more easily or open a narrow drainage angle.
          - listitem [ref=e268]:
            - img "Surgery" [ref=e270]
            - generic [ref=e271]:
              - heading "Surgery" [level=3] [ref=e276]
              - paragraph [ref=e277]: When drops or laser are not enough, surgery creates a new route for fluid to leave the eye. Options range from minimally invasive glaucoma surgery (MIGS) to conventional operations.
        - paragraph [ref=e279]: The choice depends on the type of glaucoma, how far it has gone and the person’s health. The doctor explains the options and what each can and cannot do. Check-ups continue after treatment, because glaucoma needs watching over the long term.
    - region "How glaucoma can narrow side vision" [ref=e280]:
      - generic [ref=e281]:
        - generic [ref=e282]:
          - paragraph [ref=e283]: See it explained
          - heading "How glaucoma can narrow side vision" [level=2] [ref=e284]
          - paragraph [ref=e285]: The change is usually gradual, which is why regular examinations matter.
        - figure [ref=e286]:
          - generic [ref=e291]:
