                - list [ref=f3e515]:
                  - listitem [ref=f3e516]: Drooping eyelids (ptosis) that make the eye look tired or affect vision
                  - listitem [ref=f3e517]: Persistent watering or tear-drainage problems
                  - listitem [ref=f3e518]: Eyelids turning inward or outward
                  - listitem [ref=f3e519]: Other eyelid-position concerns
            - article [ref=f3e520]:
