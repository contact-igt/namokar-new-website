                  - listitem [ref=f5e517]: Persistent watering or tear-drainage problems
                  - listitem [ref=f5e518]: Eyelids turning inward or outward
                  - listitem [ref=f5e519]: Other eyelid-position concerns
            - article [ref=f5e520]:
