    - region "What is aesthetic oculoplasty?" [ref=f4e51]:
      - generic [ref=f4e52]:
        - generic [ref=f4e53]:
          - paragraph [ref=f4e54]: Oculoplasty & Eye-Area Care
          - heading "What is aesthetic oculoplasty?" [level=2] [ref=f4e55]
        - generic [ref=f4e56]:
          - paragraph [ref=f4e57]: Aesthetic oculoplasty is a specialized branch of eye care that combines ophthalmology and plastic surgery for the delicate areas around the eyes. It focuses on concerns such as heavy eyelids, under-eye bags, wrinkles and age-related changes around the eyes.
          - paragraph [ref=f4e58]: Unlike general cosmetic procedures, aesthetic oculoplasty is performed with attention to both appearance and eye safety.
          - figure [ref=f4e59]:
            - img "An ophthalmic specialist explaining the eye area to a patient during a consultation" [ref=f4e61]
