        - generic [ref=f2e23]:
          - paragraph [ref=f2e24]: Comprehensive Eye Examinations
          - heading "A thorough eye check, explained in plain language." [level=1] [ref=f2e25]
          - paragraph [ref=f2e26]: An examination looks at how well you see and how healthy your eyes are. It is where any further care begins, explained step by step.
          - link "Call to Book an Appointment" [ref=f2e27] [cursor=pointer]:
            - /url: tel:+919810419720
    - region "What a comprehensive examination is" [ref=f2e30]:
      - generic [ref=f2e31]:
        - generic [ref=f2e32]:
          - paragraph [ref=f2e33]: Comprehensive Eye Examinations
          - heading "What a comprehensive examination is" [level=2] [ref=f2e34]
        - generic [ref=f2e35]:
          - figure [ref=f2e36]:
            - img "Eye examination at Namokar Eye & Oculoplasty Centre" [ref=f2e37]
          - generic [ref=f2e38]:
            - paragraph [ref=f2e39]: A comprehensive eye examination looks at more than your spectacle number. The doctor checks how well you see, how your eyes work together and the health of the structures inside and around the eye. It is for adults and for children, whether or not they wear glasses.
            - paragraph [ref=f2e41]: Many eye conditions, such as cataract, glaucoma and the eye changes that can come with diabetes, develop slowly and without pain. An examination can find them before they cause obvious symptoms, which is often when they are easiest to manage.
            - paragraph [ref=f2e42]: It is also the starting point for any further tests or treatment. The tests used depend on your symptoms, age and health and are chosen by the doctor, who explains the findings in plain language so that you understand what comes next.
    - region "What happens during a comprehensive eye examination" [ref=f2e43]:
      - generic [ref=f2e44]:
        - generic [ref=f2e45]:
          - paragraph [ref=f2e46]: See it explained
          - heading "What happens during a comprehensive eye examination" [level=2] [ref=f2e47]
          - paragraph [ref=f2e48]: Each step checks a different part of your vision and eye health.
        - generic [ref=f2e49]:
          - article [ref=f2e50]:
            - img "An eye-care professional checking an adult patient's distance vision using an illuminated eye chart" [ref=f2e52]
            - generic [aria-hidden] [ref=f2e53]: "01"
            - generic [ref=f2e54]:
              - heading "How well you see" [level=3] [ref=f2e55]
              - paragraph [ref=f2e56]: Your vision is checked with and without spectacles.
          - article [ref=f2e57]:
            - img "An eye-care professional checking an adult patient's spectacle prescription with a phoropter" [ref=f2e59]
            - generic [aria-hidden] [ref=f2e60]: "02"
            - generic [ref=f2e61]:
              - heading "Spectacle needs" [level=3] [ref=f2e62]
              - paragraph [ref=f2e63]: Your eyes are tested to see whether glasses would help, or whether your prescription has changed.
          - article [ref=f2e64]:
            - img "An eye-care professional measuring an adult patient's eye pressure with a non-contact tonometer" [ref=f2e66]
            - generic [aria-hidden] [ref=f2e67]: "03"
            - generic [ref=f2e68]:
              - heading "Eye pressure" [level=3] [ref=f2e69]
              - paragraph [ref=f2e70]: The pressure inside the eye may be measured as part of looking for conditions such as glaucoma.
          - article [ref=f2e71]:
            - img "An eye-care professional examining the front of an adult patient's eye with a slit lamp" [ref=f2e73]
            - generic [aria-hidden] [ref=f2e74]: "04"
            - generic [ref=f2e75]:
              - heading "The front of the eye" [level=3] [ref=f2e76]
              - paragraph [ref=f2e77]: The eyelids, the surface of the eye and the lens are examined.
          - article [ref=f2e78]:
            - img "An eye-care professional examining an adult patient's retina with a fundus camera" [ref=f2e80]
            - generic [aria-hidden] [ref=f2e81]: "05"
            - generic [ref=f2e82]:
              - heading "The back of the eye" [level=3] [ref=f2e83]
              - paragraph [ref=f2e84]: The retina and optic nerve are looked at, sometimes after drops that widen the pupil.
        - paragraph [ref=f2e85]: The tests used depend on your symptoms and age and are chosen by the doctor.
    - region "Reasons to book an eye check" [ref=f2e86]:
      - generic [ref=f2e87]:
        - generic [ref=f2e88]:
          - paragraph [ref=f2e89]: Know the signs
          - heading "Reasons to book an eye check" [level=2] [ref=f2e90]
        - generic [ref=f2e91]:
          - generic [ref=f2e92]: A change in your vision, or spectacles that no longer help as they did
          - generic [ref=f2e97]: Frequent headaches, or tired, strained eyes when reading or using screens
          - generic [ref=f2e102]: Eyes that water, feel dry or irritated, or look red often
          - generic [ref=f2e107]: Seeing floaters or flashes of light, which should be checked promptly
          - generic [ref=f2e112]: Diabetes or high blood pressure, for which regular eye checks are usually advised
          - generic [ref=f2e117]: A family history of eye disease such as glaucoma
          - generic [ref=f2e122]: A child who sits very close to screens, squints, rubs the eyes often or struggles to read
          - generic [ref=f2e127]: Being over 40, when changes in near vision and the risk of some eye conditions begin to rise
          - generic [ref=f2e132]: It has been a long time since your last examination
          - generic [ref=f2e137]:
            - strong [ref=f2e138]: "Urgent Medical Attention:"
            - paragraph [ref=f2e139]: Sudden loss of vision, a new eye injury, or severe eye pain needs urgent medical attention. Do not wait for a routine appointment.
    - region "What an assessment involves" [ref=f2e140]:
      - generic [ref=f2e141]:
        - generic [ref=f2e142]:
          - paragraph [ref=f2e143]: What to expect
          - heading "What an assessment involves" [level=2] [ref=f2e144]
          - paragraph [ref=f2e145]: A general outline of a visit. The tests used are chosen by the doctor, and you can ask questions at any point.
        - list [ref=f2e146]:
          - listitem [ref=f2e147]:
            - generic [aria-hidden] [ref=f2e148]: "01"
            - heading "Before you come" [level=3] [ref=f2e149]
            - paragraph [ref=f2e150]: Bring previous prescriptions and eye reports, your current spectacles or contact lenses and a list of your medicines. Note down any symptoms and questions you want to raise.
          - listitem [ref=f2e151]:
            - generic [aria-hidden] [ref=f2e152]: "02"
            - heading "Your history and symptoms" [level=3] [ref=f2e153]
            - paragraph [ref=f2e154]: The doctor asks about your vision, any symptoms, your general health, medicines and family history, because these shape which tests are useful for you.
          - listitem [ref=f2e155]:
            - generic [aria-hidden] [ref=f2e156]: "03"
            - heading "The examination" [level=3] [ref=f2e157]
            - paragraph [ref=f2e158]: Your vision is checked, and the front and back of the eye are examined. Some visits include drops that widen the pupil; they can blur vision for some hours, so ask whether to bring someone with you.
          - listitem [ref=f2e159]:
            - generic [aria-hidden] [ref=f2e160]: "04"
            - heading "The doctor's explanation" [level=3] [ref=f2e161]
            - paragraph [ref=f2e162]: The findings are explained in plain language, and your questions are answered. If glasses would help, you are told what your eyes need.
          - listitem [ref=f2e163]:
            - generic [aria-hidden] [ref=f2e164]: "05"
            - heading "Next steps" [level=3] [ref=f2e165]
            - paragraph [ref=f2e166]: If further tests or treatment are advised, the doctor explains why, what the options are and what to expect.
          - listitem [ref=f2e167]:
            - generic [aria-hidden] [ref=f2e168]: "06"
            - heading "Review" [level=3] [ref=f2e169]
            - paragraph [ref=f2e170]: The doctor tells you when to have your eyes checked again, which depends on your age, health and what was found.
