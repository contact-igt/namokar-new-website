<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none" stroke="currentColor">
  <!-- Jain Ahimsa Hand Watermark -->
  <!-- Hand Palm & Fingers Contour -->
  <path
    d="M 125 560
       C 115 520, 110 470, 105 400
       C 90 380, 75 350, 70 320
       C 60 280, 68 250, 85 240
       C 105 230, 120 250, 128 280
       C 130 230, 130 180, 132 120
       C 134 85, 160 85, 162 120
       C 165 190, 165 210, 166 230
       C 168 180, 172 130, 178 70
       C 182 35, 212 35, 214 70
       C 218 150, 218 190, 220 230
       C 223 180, 228 140, 235 100
       C 240 70, 268 70, 270 100
       C 274 160, 274 210, 275 250
       C 278 200, 285 170, 292 150
       C 298 130, 324 135, 325 160
       C 328 210, 325 280, 320 330
       C 315 400, 310 460, 290 520
       C 285 540, 280 555, 270 560
       Z"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Dharmachakra (Wheel of Ahimsa) in palm -->
  <g transform="translate(200, 385)">
    <!-- Outer rim -->
    <circle cx="0" cy="0" r="62" stroke-width="4.5" />
    <circle cx="0" cy="0" r="54" stroke-width="2.5" stroke-dasharray="3 3" />
    <!-- Inner hub -->
    <circle cx="0" cy="0" r="22" stroke-width="3.5" />
    <circle cx="0" cy="0" r="8" fill="currentColor" stroke="none" />
    <!-- 24 Spokes of Dharmachakra -->
    <g stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="-54" x2="0" y2="-22" />
      <line x1="0" y1="22" x2="0" y2="54" />
      <line x1="-54" y1="0" x2="-22" y2="0" />
      <line x1="22" y1="0" x2="54" y2="0" />

      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(15)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(30)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(45)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(60)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(75)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(90)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(105)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(120)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(135)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(150)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(165)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(180)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(195)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(210)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(225)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(240)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(255)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(270)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(285)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(300)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(315)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(330)" />
      <line x1="0" y1="-54" x2="0" y2="-22" transform="rotate(345)" />
