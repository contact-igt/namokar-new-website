<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#fffaf6"/>
      <stop offset="1" stop-color="#f9d5be"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2f1f2"/>
      <stop offset="1" stop-color="#9fc2c4"/>
    </linearGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbf4ef"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners matching section style -->
  <rect width="400" height="260" rx="24" fill="url(#bg)"/>

  <!-- Optical centerline axis -->
  <line x1="20" y1="130" x2="360" y2="130" stroke="#d7b6a0" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>

  <!-- Eyeball horizontal cross-section (sclera) -->
  <path d="M 125 55 C 190 55, 255 78, 255 130 C 255 182, 190 205, 125 205 C 80 205, 80 55, 125 55 Z" 
        fill="url(#sclera)" stroke="#c99a80" stroke-width="3.5"/>

  <!-- Retina layer along the posterior inner wall -->
  <path d="M 195 72 C 244 92, 248 168, 195 188" 
        fill="none" stroke="#d66b1f" stroke-width="5" stroke-linecap="round"/>

  <!-- Cornea (transparent anterior bulging curve) -->
  <path d="M 94 80 C 62 100, 62 160, 94 180" 
        fill="none" stroke="#073f46" stroke-width="4" stroke-linecap="round"/>

  <!-- Iris apertures -->
  <line x1="110" y1="70" x2="114" y2="98" stroke="#073f46" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="110" y1="190" x2="114" y2="162" stroke="#073f46" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Crystalline Lens (biconvex) -->
  <path d="M 122 98 C 136 108, 136 152, 122 162 C 112 152, 112 108, 122 98 Z" 
        fill="url(#lens)" stroke="#073f46" stroke-width="3"/>

  <!-- Parallel incoming light rays from distant object (left) -->
  <line x1="25" y1="92" x2="80" y2="92" stroke="#073f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="130" x2="72" y2="130" stroke="#073f46" stroke-width="3" stroke-linecap="round"/>
  <line x1="25" y1="168" x2="80" y2="168" stroke="#073f46" stroke-width="3" stroke-linecap="round"/>

  <!-- Cornea refraction segment -->
  <line x1="80" y1="92" x2="120" y2="104" stroke="#073f46" stroke-width="2.5"/>
  <line x1="80" y1="168" x2="120" y2="156" stroke="#073f46" stroke-width="2.5"/>

  <!-- Lens refraction through intraocular vitreous cavity -->
  <line x1="126" y1="106" x2="242" y2="122" stroke="#073f46" stroke-width="3"/>
  <line x1="128" y1="130" x2="254" y2="130" stroke="#073f46" stroke-width="3"/>
  <line x1="126" y1="154" x2="242" y2="138" stroke="#073f46" stroke-width="3"/>

  <!-- Blur circle on the retina (unfocused rays hitting retina) -->
  <line x1="244" y1="120" x2="244" y2="140" stroke="#e53935" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Rays converging BEHIND the retina (hallmark of Hyperopia) -->
  <line x1="242" y1="122" x2="315" y2="130" stroke="#d66b1f" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="254" y1="130" x2="315" y2="130" stroke="#d66b1f" stroke-width="2.5" stroke-dasharray="4 3"/>
  <line x1="242" y1="138" x2="315" y2="130" stroke="#d66b1f" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Focal Point F behind the retina -->
  <circle cx="315" cy="130" r="12" fill="#d66b1f" opacity="0.2"/>
  <circle cx="315" cy="130" r="6" fill="#d66b1f" stroke="#ffffff" stroke-width="2"/>
</svg>
