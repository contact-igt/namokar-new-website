<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Clay Tile Gradients & Filters -->
      <linearGradient id="tileGradPtosis" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFF2E7" />
        <stop offset="45%" stop-color="#FCE6D4" />
        <stop offset="100%" stop-color="#F3D2BA" />
      </linearGradient>

      <linearGradient id="clayTerraPtosis" x1="60" y1="90" x2="190" y2="160" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#F4955B" />
        <stop offset="40%" stop-color="#E27433" />
        <stop offset="100%" stop-color="#B84E14" />
      </linearGradient>

      <linearGradient id="clayArrowPtosis" x1="128" y1="210" x2="128" y2="140" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#E26D2B" />
        <stop offset="60%" stop-color="#F58E4E" />
        <stop offset="100%" stop-color="#FFA873" />
      </linearGradient>

      <!-- Clay Drop Shadow -->
      <filter id="tileShadowPtosis" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C27A4E" flood-opacity="0.28" />
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A15426" flood-opacity="0.16" />
      </filter>

      <!-- 3D Element Shadow -->
      <filter id="elemShadowPtosis" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#8E3C0F" flood-opacity="0.32" />
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#692404" flood-opacity="0.2" />
      </filter>
    </defs>

    <!-- Base Clay Squircle Tile -->
    <rect x="18" y="14" width="220" height="220" rx="54" fill="url(#tileGradPtosis)" filter="url(#tileShadowPtosis)" />
    <!-- Inner Rim Highlight -->
    <rect x="20" y="16" width="216" height="216" rx="52" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" />
    <rect x="22" y="18" width="212" height="212" rx="50" stroke="#FCE6D4" stroke-opacity="0.5" stroke-width="2" />

    <!-- 3D CLAY PTOSIS (Drooping Upper Eyelid) -->
    <g filter="url(#elemShadowPtosis)">
      <!-- Eyeball Sclera Peek -->
      <path d="M 64 125 C 92 148, 164 148, 192 125 C 172 108, 84 108, 64 125 Z" fill="#FFFFFF" opacity="0.95" />
      <!-- Iris/Pupil peek under drooping lid -->
      <circle cx="128" cy="120" r="26" fill="#3A82A3" />
      <circle cx="128" cy="120" r="14" fill="#0B3539" />
      <circle cx="134" cy="114" r="5" fill="#FFFFFF" opacity="0.9" />

      <!-- Thick 3D Drooping Upper Eyelid -->
      <path
        d="M 52 118 C 88 100, 168 100, 204 118 C 188 136, 68 136, 52 118 Z"
        fill="url(#clayTerraPtosis)"
      />
      <!-- Eyelid Top Highlight Rim -->
      <path
        d="M 56 117 C 90 102, 166 102, 200 117"
        stroke="#FFBA8F"
        stroke-width="4.5"
        stroke-linecap="round"
      />

      <!-- 3D Clay Eyelashes (cylindrical clay rods pointing downward from drooping lid) -->
      <path d="M 78 128 L 72 148" stroke="#D15F22" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 78 128 L 72 148" stroke="#FFAE80" stroke-width="2.5" stroke-linecap="round" />
      
      <path d="M 103 133 L 101 156" stroke="#D15F22" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 103 133 L 101 156" stroke="#FFAE80" stroke-width="2.5" stroke-linecap="round" />

      <path d="M 128 135 L 128 160" stroke="#D15F22" stroke-width="7" stroke-linecap="round" />
      <path d="M 128 135 L 128 160" stroke="#FFAE80" stroke-width="2.5" stroke-linecap="round" />

      <path d="M 153 133 L 155 156" stroke="#D15F22" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 153 133 L 155 156" stroke="#FFAE80" stroke-width="2.5" stroke-linecap="round" />

      <path d="M 178 128 L 184 148" stroke="#D15F22" stroke-width="6.5" stroke-linecap="round" />
      <path d="M 178 128 L 184 148" stroke="#FFAE80" stroke-width="2.5" stroke-linecap="round" />

      <!-- Lower Lid Line -->
      <path d="M 64 126 C 92 152, 164 152, 192 126" stroke="#BA6029" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- 3D Clay Upward Arrow (Lift / Correction indicator) -->
    <g filter="url(#elemShadowPtosis)">
      <!-- Arrow Stem -->
      <rect x="122" y="166" width="12" height="42" rx="6" fill="url(#clayArrowPtosis)" />
      <!-- Arrow Head -->
      <path
        d="M 108 174 L 128 146 L 148 174 Z"
        fill="url(#clayArrowPtosis)"
        stroke="#FFAE80"
        stroke-width="2.5"
        stroke-linejoin="round"
      />
      <!-- Arrow Specular Highlight -->
      <path d="M 128 152 L 142 172" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />
      <path d="M 125 170 L 125 202" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    </g>
  </svg>