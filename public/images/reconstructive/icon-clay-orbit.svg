<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="tileGradOrb" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFF2E7" />
        <stop offset="45%" stop-color="#FCE6D4" />
        <stop offset="100%" stop-color="#F3D2BA" />
      </linearGradient>

      <linearGradient id="boneGrad" x1="50" y1="50" x2="200" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FAF1E8" />
        <stop offset="50%" stop-color="#EADBCC" />
        <stop offset="100%" stop-color="#CEBCA9" />
      </linearGradient>

      <filter id="tileShadowOrb" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C27A4E" flood-opacity="0.28" />
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#A15426" flood-opacity="0.16" />
      </filter>

      <filter id="elemShadowOrb" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#8E3C0F" flood-opacity="0.32" />
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#692404" flood-opacity="0.2" />
      </filter>
    </defs>

    <!-- Base Clay Squircle Tile -->
    <rect x="18" y="14" width="220" height="220" rx="54" fill="url(#tileGradOrb)" filter="url(#tileShadowOrb)" />
    <rect x="20" y="16" width="216" height="216" rx="52" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" />
    <rect x="22" y="18" width="212" height="212" rx="50" stroke="#FCE6D4" stroke-opacity="0.5" stroke-width="2" />

    <!-- 3D CLAY BONY ORBIT SOCKET & EYEBALL -->
    <g filter="url(#elemShadowOrb)">
      <!-- Outer Cranial Orbital Bone Cavity -->
      <path
        d="M 68 76 C 96 52, 160 52, 188 76 C 212 98, 212 142, 184 170 C 154 196, 102 196, 72 170 C 44 142, 44 98, 68 76 Z"
        fill="url(#boneGrad)"
        stroke="#FFFFFF"
        stroke-width="3.5"
      />

      <!-- Orbital Cavity Interior Depth Shadow -->
      <path
        d="M 76 86 C 100 66, 156 66, 180 86 C 200 106, 200 136, 176 160 C 150 182, 106 182, 80 160 C 56 136, 56 106, 76 86 Z"
        fill="#C2B09D"
        opacity="0.5"
      />

      <!-- 3D Eyeball nestled securely inside the socket -->
      <circle cx="128" cy="126" r="42" fill="#FFFFFF" stroke="#E5D6C8" stroke-width="2" />
      
      <!-- Iris & Pupil -->
      <circle cx="125" cy="126" r="23" fill="#3A82A3" />
      <circle cx="125" cy="126" r="11" fill="#0B3539" />
      <circle cx="131" cy="120" r="4.5" fill="#FFFFFF" opacity="0.9" />

      <!-- Orbital Bone Specular Highlight -->
      <path d="M 80 72 C 104 56, 152 56, 176 72" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Bone Suture Lines -->
      <path d="M 128 48 L 128 62" stroke="#BAA591" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 188 152 L 204 162" stroke="#BAA591" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </svg>