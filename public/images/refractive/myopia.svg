us before retina</text><path d="M429 286V190" fill="none" stroke="#a9440d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="474" y="36" fill="#073f46" font-family="Arial,sans-serif" font-size="22">Retina</text><path d="M517 43 522 156" fill="none" stroke="#55616a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>